[project]
name = "llm-ssm"
version = "0.1.0"
description = "Input vs. state gating in selective state space models: IG, SG and DG"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "hydra-core>=1.3.2",
    "numpy>=2.0.2",
    "scikit-learn>=1.6.1",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
]

[project.optional-dependencies]
mamba = [
    "mamba-ssm>=2.3.0",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools]
packages = ["datasets", "models", "preprocessing", "utils", "monitor"]

# uv integration with PyTorch: https://docs.astral.sh/uv/guides/integration/pytorch/
[[tool.uv.index]]
name = "pytorch-cu128"       
url = "https://download.pytorch.org/whl/cu128"  
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
